 <!-- Zttc: a register with as many 16-bit columns as an accumulator register has columns -->
 <text x="268" y="106" text-anchor="middle">RLEN/16 = N</text>
 <text x="372" y="106" text-anchor="middle">N</text>
 <text x="268" y="122" text-anchor="middle" font-family="monospace">m4</text>
 <text x="372" y="122" text-anchor="middle" font-family="monospace">acc0</text>
