<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="728" height="304" viewBox="0 0 728 304" font-family="sans-serif" font-size="11" fill="#1a1a1a">
 <rect width="728" height="304" fill="#ffffff"/>

 <!-- Detail panels, opened from the extension each one shows -->
 <g fill="#f4f4f4" stroke="#a6a6a6" stroke-width="0.8">
  <path d="M24 38L20 98V296H204V98L96 38Z"/>
  <path d="M274 38L262 98V296H454V98L346 38Z"/>
  <path d="M504 38L548 98V296H714V98L576 38Z"/>
 </g>

 <!-- Dependencies: an arrow points to the extension that depends on its origin -->
 <g fill="#ffffff" stroke="#1a1a1a">
  <rect x="24" y="14" width="72" height="24"/>
  <rect x="274" y="14" width="72" height="24"/>
  <rect x="504" y="14" width="72" height="24"/>
  <rect x="258" y="56" width="104" height="24"/>
  <rect x="488" y="56" width="104" height="24"/>
  <rect x="636" y="56" width="72" height="24" stroke-width="2"/>
 </g>
 <g font-size="12" font-weight="bold" text-anchor="middle">
  <text x="60" y="30">Ztte</text>
  <text x="310" y="30">Zttc</text>
  <text x="540" y="30">Zttg</text>
  <text x="310" y="72">Zttn (G = 1)</text>
  <text x="540" y="72">Zttn (G &gt; 1)</text>
  <text x="672" y="72">Ztt</text>
 </g>
 <g stroke="#1a1a1a" fill="none">
  <path d="M96 26H267"/>
  <path d="M346 26H497"/>
  <path d="M310 38V49"/>
  <path d="M540 38V49"/>
  <path d="M362 68H481"/>
  <path d="M592 68H629"/>
 </g>
 <path d="M274 26l-7 -4v8zM504 26l-7 -4v8zM310 56l-4 -7h8zM540 56l-4 -7h8zM488 68l-7 -4v8zM636 68l-7 -4v8z"/>

 <!-- Ztte: one register of RLEN = 4N beside an accumulator register of four parts -->
 <g transform="translate(8 24)">
  <text x="52" y="106" text-anchor="middle">RLEN/16</text>
  <text x="132" y="106" text-anchor="middle">N</text>
  <text x="52" y="122" text-anchor="middle" font-family="monospace">m4</text>
  <text x="132" y="122" text-anchor="middle" font-family="monospace">acc0</text>
  <text transform="translate(32 162) rotate(-90)" text-anchor="middle">N rows</text>
  <rect x="44" y="130" width="16" height="64" fill="#d9e6f5" stroke="#1a1a1a"/>
  <rect x="100" y="130" width="64" height="64" fill="#f4e7c9"/>
  <rect x="116" y="130" width="16" height="64" fill="#e3c57f"/>
  <rect x="100" y="130" width="64" height="64" fill="none" stroke="#1a1a1a"/>
  <path d="M116 130V194M132 130V194M148 130V194" stroke="#1a1a1a" stroke-width="0.8" stroke-dasharray="3 2" fill="none"/>
  <g font-size="9" text-anchor="middle">
   <text x="108" y="143">0</text>
   <text x="124" y="143">1</text>
   <text x="140" y="143">2</text>
   <text x="156" y="143">3</text>
  </g>
  <path d="M124 198V212H52V204" stroke="#1a1a1a" fill="none"/>
  <path d="M52 197l-4 7h8z"/>
  <text x="99" y="227" text-anchor="end" font-family="monospace">mcvt</text>
  <text x="101" y="227">, part 1</text>
  <text x="104" y="250" text-anchor="middle">RLEN = 2N to 16N; 4N shown</text>
  <text x="104" y="265" text-anchor="middle">4 accumulator registers</text>
 </g>

 <!-- Zttc: a register with as many 16-bit columns as an accumulator register has columns -->
 <g transform="translate(38 24)">
  <text x="268" y="106" text-anchor="middle">RLEN/16 = N</text>
  <text x="372" y="106" text-anchor="middle">N</text>
  <text x="268" y="122" text-anchor="middle" font-family="monospace">m4</text>
  <text x="372" y="122" text-anchor="middle" font-family="monospace">acc0</text>
  <rect x="236" y="130" width="64" height="64" fill="#d9e6f5" stroke="#1a1a1a"/>
  <rect x="340" y="130" width="64" height="64" fill="#e3c57f" stroke="#1a1a1a"/>
  <path d="M372 198V212H268V204" stroke="#1a1a1a" fill="none"/>
  <path d="M268 197l-4 7h8z"/>
  <text x="300" y="227" text-anchor="end" font-family="monospace">mcvt</text>
  <text x="302" y="227">, whole register</text>
  <text x="320" y="250" text-anchor="middle">operations on accumulators</text>
  <text x="320" y="265" text-anchor="middle">8 accumulator registers</text>
 </g>

 <!-- Zttg: a group of two registers -->
 <g transform="translate(111 24)">
  <text x="520" y="106" text-anchor="middle">2N</text>
  <text x="520" y="122" text-anchor="middle" font-family="monospace">m4x2</text>
  <rect x="456" y="130" width="64" height="64" fill="#d9e6f5" stroke="#1a1a1a"/>
  <rect x="520" y="130" width="64" height="64" fill="#d9e6f5" stroke="#1a1a1a"/>
  <text x="488" y="166" text-anchor="middle" font-family="monospace">m4</text>
  <text x="552" y="166" text-anchor="middle" font-family="monospace">m5</text>
  <text x="520" y="250" text-anchor="middle">operands of 2 or 4 registers:</text>
  <text x="520" y="265" text-anchor="middle">wider elements, longer K</text>
 </g>
</svg>
